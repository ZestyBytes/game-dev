  // into one combined shape that always becomes a color bomb at the shared
  // cell, regardless of how long either arm is on its own - a plain 3-long
  // row run crossing a plain 3-long col run is exactly the classic "T of
  // three by three" shape and should bomb just like a real 5-in-a-row does.
  // Runs that don't intersect anything keep the existing length-based rules
  // (4 long -> stripe, 5+ -> bomb) applied later in resolveBoardSteps.
  function groupMatchShapes(runs) {
    const rowRuns = runs.filter((r) => r.dir === "row");
    const colRuns = runs.filter((r) => r.dir === "col");
    const usedCol = new Set();
    const shapes = [];

    rowRuns.forEach((rr) => {
      const j = colRuns.findIndex((cr, idx) => !usedCol.has(idx) && rr.cells.some((p) => cr.cells.some((q) => q[0] === p[0] && q[1] === p[1])));
      if (j === -1) {
        shapes.push(rr);
        return;
      }
      const cr = colRuns[j];
      usedCol.add(j);
      const anchor = rr.cells.find((p) => cr.cells.some((q) => q[0] === p[0] && q[1] === p[1]));
      const merged = new Map();
      [...rr.cells, ...cr.cells].forEach((p) => merged.set(keyOf(p), p));
      shapes.push({ cells: [...merged.values()], special: "color", anchor });
    });
    colRuns.forEach((cr, j) => { if (!usedCol.has(j)) shapes.push(cr); });
    return shapes;
  }

  // Generates a board with no matches already on it, AND at least one legal
  // move available (regenerating from scratch on the rare unplayable roll -
  // astronomically unlikely on an 8x8 board with 5 types, but a silently
  // stuck board would be a much worse bug than one extra generation pass).
  function createBoard() {
    let board;
    let deadlockGuard = 0;
    do {
      board = Array.from({ length: BOARD_SIZE }, () => Array.from({ length: BOARD_SIZE }, randomCandy));
      let guard = 0;
      while (findMatchRuns(board).length && guard++ < 200) {
        for (const run of findMatchRuns(board)) {
          for (const [r, c] of run.cells) board[r][c] = randomCandy();
        }
      }
    } while (!findHint(board) && deadlockGuard++ < 20);
    return board;
  }

  function isAdjacent([r1, c1], [r2, c2]) {
    return Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1;
  }

  function swapCells(board, [r1, c1], [r2, c2]) {
    const tmp = board[r1][c1];
    board[r1][c1] = board[r2][c2];
    board[r2][c2] = tmp;
  }

  const keyOf = ([r, c]) => `${r},${c}`;

  // Finds one adjacent swap that's actually legal to make right now - either
  // it creates a match, or (since a special-swap combo needs no match) both
  // candies are specials. Returns null when the board is genuinely stuck.
  // Used both for the idle hint and to decide whether to auto-reshuffle.
  function findHint(board) {
    for (let r = 0; r < BOARD_SIZE; r++) {
      for (let c = 0; c < BOARD_SIZE; c++) {
        for (const [dr, dc] of [[0, 1], [1, 0]]) {
          const r2 = r + dr, c2 = c + dc;
          if (r2 >= BOARD_SIZE || c2 >= BOARD_SIZE) continue;
          const a = board[r][c], b = board[r2][c2];
          if (a && b && a.special && b.special) return [[r, c], [r2, c2]];
          swapCells(board, [r, c], [r2, c2]);
          const hasMatch = findMatchRuns(board).length > 0;
          swapCells(board, [r, c], [r2, c2]); // revert - this is a probe, not a real move
          if (hasMatch) return [[r, c], [r2, c2]];
        }
      }
    }
    return null;
  }

  function refillBoard(board) {
    for (let c = 0; c < BOARD_SIZE; c++) {
      const column = [];
      for (let r = 0; r < BOARD_SIZE; r++) if (board[r][c]) column.push(board[r][c]);
      const missing = BOARD_SIZE - column.length;
      const fresh = Array.from({ length: missing }, randomCandy);
      const newColumn = fresh.concat(column);
      for (let r = 0; r < BOARD_SIZE; r++) board[r][c] = newColumn[r];
    }
  }

  // Async generator: yields animation "beats" exactly like the terminal build's
  // resolve_board_steps, so the whole cascade plays out visibly. Each "flash"
  // step carries `delta` (points this clear is about to add) and
  // `specialsCreated` up front, before the board mutates, so the caller can
  // drive a score popup / sound / combo text right at the moment of impact.
  async function* resolveBoardSteps(board, score, swappedPos) {
    let matchedAny = false;

    while (true) {
      const runs = findMatchRuns(board);
      if (!runs.length) break;
      matchedAny = true;

      const clearSet = new Map(); // key -> [r,c]
      const newSpecials = new Map(); // key -> special type

      for (const shape of groupMatchShapes(runs)) {
        const { cells } = shape;
        if (shape.special === "color") {
          // An L/T/+ crossing of a row-run and a col-run - always a bomb at
          // the shared cell, whatever length either arm is on its own.
          newSpecials.set(keyOf(shape.anchor), "color");
          for (const p of cells) {
            if (p[0] !== shape.anchor[0] || p[1] !== shape.anchor[1]) clearSet.set(keyOf(p), p);
          }
        } else if (cells.length >= 4) {
          const swappedInRun = swappedPos && cells.some((p) => p[0] === swappedPos[0] && p[1] === swappedPos[1]);
          const anchor = swappedInRun ? swappedPos : cells[Math.floor(cells.length / 2)];
          newSpecials.set(keyOf(anchor), cells.length >= 5 ? "color" : shape.dir);
          for (const p of cells) {
            if (p[0] !== anchor[0] || p[1] !== anchor[1]) clearSet.set(keyOf(p), p);
          }
        } else {
          for (const p of cells) clearSet.set(keyOf(p), p);
        }
      }

      // trigger power candies caught in the blast
      let frontier = new Set(clearSet.keys());
      const seen = new Set();
      while (frontier.size) {
        const next = new Set();
        for (const k of frontier) {
          if (seen.has(k)) continue;
          seen.add(k);
          const [r, c] = k.split(",").map(Number);
          const cell = board[r][c];
          if (!cell) continue;
          if (cell.special === "row") {
            for (let cc = 0; cc < BOARD_SIZE; cc++) {
              const kk = keyOf([r, cc]);
              if (!clearSet.has(kk)) { clearSet.set(kk, [r, cc]); next.add(kk); }
            }
          } else if (cell.special === "col") {
            for (let rr = 0; rr < BOARD_SIZE; rr++) {
              const kk = keyOf([rr, c]);
              if (!clearSet.has(kk)) { clearSet.set(kk, [rr, c]); next.add(kk); }
            }
          } else if (cell.special === "color") {
            const type = cell.type;
            for (let rr = 0; rr < BOARD_SIZE; rr++) {
              for (let cc = 0; cc < BOARD_SIZE; cc++) {
                const kk = keyOf([rr, cc]);
                if (!clearSet.has(kk) && board[rr][cc] && board[rr][cc].type === type) {
                  clearSet.set(kk, [rr, cc]);
                  next.add(kk);
                }
              }
            }
          }
        }
        frontier = next;
      }

      for (const k of newSpecials.keys()) clearSet.delete(k);

      const delta = clearSet.size * 10 + newSpecials.size * 50;
      yield { kind: "flash", positions: [...clearSet.values()], score, delta, specialsCreated: newSpecials.size };
      score += delta;

      for (const [r, c] of clearSet.values()) board[r][c] = null;
      for (const [k, special] of newSpecials) {
        const [r, c] = k.split(",").map(Number);
        if (board[r][c]) board[r][c].special = special;
      }

      yield { kind: "popped", score };

      refillBoard(board);

      yield { kind: "refilled", score, freshCols: true };

      swappedPos = null;
    }

    yield { kind: "done", matchedAny, score };
  }

  // Which cells a combo of two specials, swapped directly into each other
  // (rather than caught in a match), blows up - the single most satisfying
  // move in the genre, and previously missing: swapping two specials with
  // no new match just reverted like any other invalid move.
  function comboClearPositions(a, b, specialA, specialB) {
    const positions = new Map(); // key -> [r,c]
    const addRow = (r) => { for (let c = 0; c < BOARD_SIZE; c++) positions.set(keyOf([r, c]), [r, c]); };
    const addCol = (c) => { for (let r = 0; r < BOARD_SIZE; r++) positions.set(keyOf([r, c]), [r, c]); };
    const addAll = () => { for (let r = 0; r < BOARD_SIZE; r++) for (let c = 0; c < BOARD_SIZE; c++) positions.set(keyOf([r, c]), [r, c]); };

    if (specialA === "color" && specialB === "color") {
      addAll(); // the biggest possible moment: clear the whole board
    } else if (specialA === "color" || specialB === "color") {
      // color bomb + a stripe: three lines of that orientation, spread
      // across the board, plus the stripe's own line.
      const stripePos = specialA === "color" ? b : a;
      const stripeDir = specialA === "color" ? specialB : specialA;
      const lines = stripeDir === "row" ? [1, 4, 6, stripePos[0]] : [1, 4, 6, stripePos[1]];
      lines.forEach(stripeDir === "row" ? addRow : addCol);
    } else {
      // stripe + stripe (row+row, col+col, or row+col): each contributes
      // its own line through its own position - a plain "+" for a mixed
      // pair, a double line for a matching pair.
      if (specialA === "row") addRow(a[0]); else addCol(a[1]);
      if (specialB === "row") addRow(b[0]); else addCol(b[1]);
    }
    return [...positions.values()];
  }

  // Mirrors resolveBoardSteps' flash/pop/refill beats for a combo blast,
  // then hands off to the normal generator so any matches the refill
  // creates keep cascading exactly like a regular move would.
  async function* resolveComboSteps(board, score, a, b) {
    const specialA = board[a[0]][a[1]].special;
    const specialB = board[b[0]][b[1]].special;
    const positions = comboClearPositions(a, b, specialA, specialB);
    const delta = positions.length * 10 + 250; // flat bonus on top, for the combo itself

    yield { kind: "flash", positions, score, delta, combo: true };
    score += delta;

    for (const [r, c] of positions) board[r][c] = null;

    yield { kind: "popped", score };

    refillBoard(board);

    yield { kind: "refilled", score, freshCols: true };

    yield* resolveBoardSteps(board, score, null);
  }

  // ---------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------
  const SHAPE_SVG = {
    circle: (fill) => `<circle cx="50" cy="50" r="46" fill="${fill}"/>`,
    square: (fill) => `<rect x="6" y="6" width="88" height="88" rx="20" fill="${fill}"/>`,
    triangle: (fill) => `<polygon points="50,6 94,90 6,90" fill="${fill}" stroke="${fill}" stroke-width="12" stroke-linejoin="round"/>`,
    diamond: (fill) => `<polygon points="50,4 96,50 50,96 4,50" fill="${fill}" stroke="${fill}" stroke-width="6" stroke-linejoin="round"/>`,
    cross: (fill) => `<path d="M35 4h30v31h31v30h-31v31h-30v-31h-31v-30h31z" fill="${fill}" stroke="${fill}" stroke-width="8" stroke-linejoin="round"/>`,
  };
  const CANDY_COLOR_VAR = { circle: "circle", square: "square", triangle: "triangle", diamond: "diamond", cross: "cross" };

  function shapeSVG(type) {
    const varName = CANDY_COLOR_VAR[type];
    const fill = `var(--c-${varName})`;
    const dark = `var(--c-${varName}-d)`;
    const gloss = `M20 30 a34 22 0 0 1 55 -8 a30 18 0 0 0 -55 8 z`;
    return `<svg class="shape" viewBox="0 0 100 100">
      <defs><clipPath id="clip-${type}">${SHAPE_SVG[type]("white")}</clipPath></defs>
      ${SHAPE_SVG[type](fill)}
      <g clip-path="url(#clip-${type})">
        <rect x="0" y="55" width="100" height="45" fill="${dark}" opacity="0.35"/>
        <ellipse cx="34" cy="28" rx="24" ry="14" fill="white" opacity="0.55"/>
      </g>
    </svg>`;
  }
  // shapeSVG(type)'s output never varies for a given type (fill/dark are
  // always the same CSS var() reference, not a resolved color) - precompute
  // it once instead of rebuilding the same markup string on every single
  // cell, on every single render, which is real CPU cost during a fast
  // cascade on a slower mobile CPU.
  const SHAPE_HTML = Object.fromEntries(CANDY_TYPES.map((t) => [t, shapeSVG(t)]));

  const state = {
    profiles: [], // the shared roster - loaded at boot, kept in memory, republished on change
    board: null,
    cursor: [0, 0],
    selected: null,
    score: 0,
    movesLeft: 0,
    movesTotal: 0,
    target: 0,
    level: 1,
    busy: false,
    profile: null,
    pendingName: "",
    pendingGem: null,
  };

  const el = {
    board: document.getElementById("board"),
    score: document.getElementById("stat-score"),
    moves: document.getElementById("stat-moves"),
    target: document.getElementById("stat-target"),
    message: document.getElementById("message"),
    quitBtn: document.getElementById("btn-quit-round"),
    bonusFill: document.getElementById("bonus-fill"),
    bonusLabel: document.getElementById("bonus-label"),
    level: document.getElementById("stat-level"),
  };

  // iOS Safari bug (the real culprit behind the "board is squished into one
  // row" mobile reports): when .board-wrap's height comes purely from the
  // height:0 + padding-bottom:100% trick, Safari sometimes resolves the
  // containing-block height for the absolutely-positioned .board (inset:0)
  // against the 0 height instead of the padding box. The grid's `1fr` rows
  // then all collapse to zero height and stack on top of each other, so
  // only one visual row of pieces shows, vertically centered in the middle
  // of an otherwise-empty square. Fix: give .board an explicit pixel height
  // that always matches its own width, so the grid never depends on that
  // ambiguous containing-block resolution at all.
  function syncBoardSquare() {
    el.board.style.height = el.board.offsetWidth + "px";
  }
  new ResizeObserver(syncBoardSquare).observe(el.board);
  syncBoardSquare();

  function setMessage(text) { el.message.textContent = text; }
  function starsHTML(count, size) {
    const cls = size || "";
    let html = "";
    for (let i = 0; i < 3; i++) html += `<span class="${i < count ? "lit" : "dim"}">\u2605</span>`;
    return html;
  }

  // ---------------------------------------------------------------------
  // Gem companion: a faceted crystal IS the avatar. Its color is a reward
  // you pick, unlocked with total stars earned (the same currency levels
  // already award); its CUT - facet count, glow, sparkle - grows on its
  // own as you earn more stars. Levelling up literally changes how it
  // looks, with no separate wardrobe of parts to draw or equip.
  // ---------------------------------------------------------------------
  function shade(hex, amt) {
    // amt in [-1, 1]: negative mixes toward black, positive toward white.
    // Used to fake per-facet lighting from a single base color.
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const target = amt < 0 ? 0 : 255;
    const p = Math.min(1, Math.abs(amt));
    r = Math.round(r + (target - r) * p);
    g = Math.round(g + (target - g) * p);
    b = Math.round(b + (target - b) * p);
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  const GEM_PALETTE = [
    { id: "quartz", hex: "#c6d2e0", label: "Quartz", unlockStars: 0 },
    { id: "citrine", hex: "#f2b93d", label: "Citrine", unlockStars: 0 },
    { id: "aqua", hex: "#4fc7c9", label: "Aquamarine", unlockStars: 0 },
    { id: "emerald", hex: "#33ad6b", label: "Emerald", unlockStars: 6 },
    { id: "sapphire", hex: "#3f6fd1", label: "Sapphire", unlockStars: 12 },
    { id: "amethyst", hex: "#9a5fd6", label: "Amethyst", unlockStars: 18 },
    { id: "ruby", hex: "#d63b5c", label: "Ruby", unlockStars: 24 },
    { id: "rose", hex: "#ef8fb0", label: "Rose Quartz", unlockStars: 28 },
    { id: "onyx", hex: "#4a4460", label: "Onyx", unlockStars: 32 },
    { id: "prism", hex: "#ffffff", label: "Prism", unlockStars: 40, prism: true },
  ];
  function gemColor(id) {
    return GEM_PALETTE.find((g) => g.id === id) || GEM_PALETTE[0];
  }
  // Migration only (see migrateProfile): old avatars had a "body" color
  // instead of a gem. Carry a rough sense of "their color" forward rather
  // than resetting everyone to the same default.
  const OLD_BODY_COLOR_TO_GEM = {
    tan: "citrine", orange: "citrine", brown: "citrine", grey: "quartz",
    cream: "quartz", green: "emerald", blue: "sapphire", purple: "amethyst",
    pink: "rose", red: "ruby",
  };

  // Visual growth tiers, driven purely by totalStars(profile) - no separate
  // storage needed, so a gem always reflects real, current progress.
  const GEM_TIERS = [
    { min: 0, name: "Shard", facets: 0, glow: 0, sparkles: 0 },
    { min: 5, name: "Cut", facets: 5, glow: 0.3, sparkles: 0 },
    { min: 15, name: "Polished", facets: 5, glow: 0.55, sparkles: 2 },
    { min: 30, name: "Radiant", facets: 10, glow: 0.75, sparkles: 4 },
    { min: 50, name: "Mythic", facets: 10, glow: 1, sparkles: 5, orbit: true, aura: true },
  ];
  function gemTierFor(stars) {
    let t = GEM_TIERS[0];
    for (const tier of GEM_TIERS) if (stars >= tier.min) t = tier;
    return t;
  }

  // Shared cut geometry: a classic five-point gem silhouette (flat table,
  // two shoulders, pointed base) in a 0-100 square viewBox.
  const GEM_OUTLINE = [[38, 18], [62, 18], [82, 38], [50, 90], [18, 38]];
  const GEM_CENTROID = [50, 40.4];
  function scalePoints(pts, center, f) {
    return pts.map(([x, y]) => [center[0] + (x - center[0]) * f, center[1] + (y - center[1]) * f]);
  }
  const RAINBOW = ["#ff5fac", "#ff8f5c", "#ffd23f", "#9be564", "#4fd6c0", "#4c8cf0", "#7a6bf0", "#b36bf0", "#ef5364", "#ffffff"];

  // Fans facets out from a center point so each one catches a different
  // amount of "light" (cosine falloff from a fixed light angle) - the same
  // trick flat-design gem icons use, just computed instead of hand-tuned.
  function facetPolygons(baseHex, facetCount, prism) {
    let pts = GEM_OUTLINE;
    let center = [50, 47];
    if (facetCount >= 10) {
      const mids = GEM_OUTLINE.map(([x, y], i) => {
        const [qx, qy] = GEM_OUTLINE[(i + 1) % GEM_OUTLINE.length];
        return [(x + qx) / 2, (y + qy) / 2];
      });
      pts = [];
      GEM_OUTLINE.forEach((p, i) => { pts.push(p); pts.push(mids[i]); });
      center = [50, 44];
    }
    const lightAngle = -2.1;
    let s = "";
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      const midAngle = Math.atan2((a[1] + b[1]) / 2 - center[1], (a[0] + b[0]) / 2 - center[0]);
      const amt = Math.max(-0.4, Math.min(0.42, Math.cos(midAngle - lightAngle) * 0.42));
      const fill = prism ? RAINBOW[i % RAINBOW.length] : shade(baseHex, amt);
      s += `<polygon points="${center.join(",")} ${a.join(",")} ${b.join(",")}" fill="${fill}"/>`;
    }
    s += `<polygon points="${GEM_OUTLINE.map((p) => p.join(",")).join(" ")}" fill="none" stroke="${shade(baseHex, -0.45)}" stroke-width="1.6" stroke-linejoin="round"/>`;
    return s;
  }

  function gemGlow(strength, baseHex) {
    if (strength <= 0) return "";
    return `<circle cx="50" cy="48" r="42" fill="${baseHex}" opacity="${(0.2 * strength).toFixed(2)}" filter="url(#gem-blur)"/>`;
  }
  function sparkleGlyph(cx, cy, r, delay) {
    const pts = [
      [cx, cy - r], [cx + r * 0.28, cy - r * 0.28], [cx + r, cy], [cx + r * 0.28, cy + r * 0.28],
      [cx, cy + r], [cx - r * 0.28, cy + r * 0.28], [cx - r, cy], [cx - r * 0.28, cy - r * 0.28],
    ];
    return `<polygon class="gem-sparkle" style="animation-delay:${delay}s" points="${pts.map((p) => p.join(",")).join(" ")}" fill="white"/>`;
  }
  const SPARKLE_POINTS = [[22, 24], [80, 30], [16, 62], [86, 66], [50, 8]];
  const ORBIT_POINTS = [[50, -4], [93, 70], [7, 70]]; // rotated as a group about (50,48)

  function auraRing() {
    return `<circle class="gem-aura" cx="50" cy="48" r="46" fill="none" stroke="white" stroke-width="2" stroke-dasharray="5 6" opacity="0.65"/>`;
  }

  function gemSVG(avatar, stars) {
    const color = gemColor(avatar.color);
    const tier = gemTierFor(stars);
    const baseHex = color.hex;
    let body;
    if (tier.facets === 0) {
      // Rough, uncut shard: smaller and duller than a finished cut.
      const rough = scalePoints(GEM_OUTLINE, GEM_CENTROID, 0.72);
      body = `<polygon points="${rough.map((p) => p.join(",")).join(" ")}" fill="${shade(baseHex, -0.12)}" stroke="${shade(baseHex, -0.4)}" stroke-width="1.4" stroke-linejoin="round" opacity="0.92"/>`;
    } else {
      body = facetPolygons(baseHex, tier.facets, color.prism);
    }
    const glow = gemGlow(tier.glow, baseHex);
    const aura = tier.aura ? auraRing() : "";
    const sparkles = SPARKLE_POINTS.slice(0, tier.sparkles).map((p, i) => sparkleGlyph(p[0], p[1], 4.5 + (i % 2) * 1.5, i * 0.3)).join("");
    const orbit = tier.orbit
      ? `<g class="gem-orbit">${ORBIT_POINTS.map((p) => sparkleGlyph(p[0], p[1], 4, 0)).join("")}</g>`
      : "";
    return `${glow}${aura}${body}${sparkles}${orbit}`;
  }

  function normalizeAvatar(avatar) {
    if (avatar && typeof avatar === "object" && typeof avatar.color === "string" && GEM_PALETTE.some((g) => g.id === avatar.color)) {
      return { color: avatar.color };
    }
    return { color: GEM_PALETTE[0].id };
  }

  // `full: true` draws the larger customize-screen preview; the default
  // (small) is used everywhere space is tight: profile lists, leaderboard,
  // the in-game player chip. `stars` (total stars earned) drives the
  // gem's growth tier - pass 0 for a plain, undressed color swatch.
  function avatarHTML(avatar, opts) {
    const full = !!(opts && opts.full);
    const stars = (opts && typeof opts.stars === "number") ? opts.stars : 0;
    const a = normalizeAvatar(avatar);
    const cls = full ? "full" : "small";
    const live = gemTierFor(stars).facets > 0 ? " gem-live" : "";
    return `<span class="avatar-stack ${cls}"><svg class="avatar-svg gem-svg${live}" viewBox="0 0 100 100" aria-hidden="true">${gemSVG(a, stars)}</svg></span>`;
  }

  function renderBoard(opts = {}) {
    const { flashSet = null, dropCols = null } = opts;
    el.board.innerHTML = "";
    const hintSet = hintCells ? new Set(hintCells.map(keyOf)) : null;
    for (let r = 0; r < BOARD_SIZE; r++) {
      for (let c = 0; c < BOARD_SIZE; c++) {
        const cellEl = document.createElement("div");
        cellEl.className = "cell";
        cellEl.dataset.r = r;
        cellEl.dataset.c = c;
        if (state.cursor[0] === r && state.cursor[1] === c) cellEl.classList.add("cursor");
        if (state.selected && state.selected[0] === r && state.selected[1] === c) cellEl.classList.add("selected");

        const cell = state.board[r][c];
        if (cell) {
          const candyEl = document.createElement("div");
          candyEl.className = "candy";
          candyEl.innerHTML = SHAPE_HTML[cell.type];
          if (cell.special) {
            const ring = document.createElement("div");
            ring.className = "power-ring " + (cell.special === "color" ? "bomb" : cell.special);
            candyEl.appendChild(ring);
          }
          if (flashSet && flashSet.has(keyOf([r, c]))) candyEl.classList.add("flash");
          if (dropCols && dropCols.has(c)) candyEl.classList.add("dropping");
          if (hintSet && hintSet.has(keyOf([r, c]))) candyEl.classList.add("hint");
          cellEl.appendChild(candyEl);
        }
        el.board.appendChild(cellEl);
      }
    }
  }

  function renderHUD() {
    el.score.textContent = state.score;
    el.moves.textContent = state.movesLeft;
    el.target.textContent = state.target;
    el.level.textContent = state.level;
    // A gentle heads-up once moves are running low, so running out never
    // feels like it came out of nowhere.
    el.moves.parentElement.classList.toggle("stat-warn", state.movesLeft > 0 && state.movesLeft <= 3);
  }

  function sleep(ms) { return new Promise((res) => setTimeout(res, ms)); }
  // Waits for an actual paint of whatever was just rendered before moving
  // on. A `renderBoard()` call followed straight by `sleep(ms)` relies on
  // the browser painting somewhere in that window - fine on desktop, but
  // some mobile/embedded WebViews can coalesce several rapid DOM rebuilds
  // into a single paint and only ever show the LAST one, so a fast cascade
  // plays every sound on schedule but only its final frame is ever seen.
  // Two rAFs (one for "next paint is scheduled", one for "it happened")
  // forces a real commit in between.
  function nextFrame() {
    return new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  }

  // Escalating callout as a single move chains into more cascades - depth 1
  // is the first clear, depth 2+ is gravity setting up another match on its
  // own. `special` picks a distinct opener for a combo-swap blast.
  const COMBO_MESSAGES = ["Sweet!", "Tasty!", "Delicious!", "Amazing!", "SUGAR RUSH!"];
  function setComboMessage(depth, special) {
    setMessage(special ? "BOOM! \u{1F4A5}" : COMBO_MESSAGES[Math.min(depth - 1, COMBO_MESSAGES.length - 1)]);
    el.message.classList.toggle("combo", special || depth >= 2);
  }

  // Floating "+N" where a clear just happened, anchored to the centroid of
  // the cells involved (in board-relative percent, so it holds position
  // regardless of board size on screen).
  function spawnScorePopup(positions, delta) {
    if (!delta || !positions.length) return;
    const avgR = positions.reduce((sum, p) => sum + p[0], 0) / positions.length;
    const avgC = positions.reduce((sum, p) => sum + p[1], 0) / positions.length;
    const popup = document.createElement("div");
    popup.className = "score-popup";
    popup.textContent = "+" + delta;
    popup.style.left = ((avgC + 0.5) / BOARD_SIZE) * 100 + "%";
    popup.style.top = ((avgR + 0.5) / BOARD_SIZE) * 100 + "%";
    el.board.appendChild(popup);
    popup.addEventListener("animationend", () => popup.remove());
  }

  function shakeBoard() {
    el.board.classList.remove("shake");
    void el.board.offsetWidth; // force reflow so re-triggering restarts the animation
    el.board.classList.add("shake");
  }
  el.board.addEventListener("animationend", (e) => {
    if (e.animationName === "board-shake") el.board.classList.remove("shake");
  });

  // ---------------------------------------------------------------------
  // Speed bonus: swap again before the bar under the board empties for a
  // score multiplier on that move - purely a reward for playing fast, never
  // a penalty for taking your time (it just settles back to a plain 1x).
  // Driven by a rAF loop (not a CSS animation) so the bar and the seconds/
  // multiplier readout under it always agree, and it can express a full
  // minute-long window smoothly rather than just looping a CSS keyframe.
  // ---------------------------------------------------------------------
  const BONUS_WINDOW_MS = 60000;
  const BONUS_MAX_MULTIPLIER = 1.5;
  let lastMoveAt = 0;
  let bonusRAF = null;

  function currentMoveMultiplier() {
    const elapsed = performance.now() - lastMoveAt;
    const frac = Math.max(0, 1 - elapsed / BONUS_WINDOW_MS);
    return 1 + (BONUS_MAX_MULTIPLIER - 1) * frac;
  }
  function tickBonusBar() {
    const elapsed = performance.now() - lastMoveAt;
    const frac = Math.max(0, 1 - elapsed / BONUS_WINDOW_MS);
    el.bonusFill.style.transform = `scaleX(${frac})`;
    if (frac <= 0) {
      el.bonusLabel.textContent = "";
      bonusRAF = null;
      return; // nothing left to animate until the next move restarts this
    }
    const secondsLeft = Math.max(1, Math.ceil((BONUS_WINDOW_MS - elapsed) / 1000));
    const multiplierNow = 1 + (BONUS_MAX_MULTIPLIER - 1) * frac;
    el.bonusLabel.textContent = `${secondsLeft}s left for ${multiplierNow.toFixed(1)}x bonus`;
    bonusRAF = requestAnimationFrame(tickBonusBar);
  }
  function restartBonusBar() {
    lastMoveAt = performance.now();
    if (bonusRAF) cancelAnimationFrame(bonusRAF);
    tickBonusBar();
  }

  // ---------------------------------------------------------------------
  // Idle hint: gently pulse a valid move after a few seconds of no input,
  // so a stuck 8-year-old never has to wonder what to do. Runs only while
  // an actual round is on screen (see showOverlay/newRound).
  // ---------------------------------------------------------------------
  const IDLE_HINT_MS = 6000;
  let idleTimer = null;
  let hintCells = null;

  function clearIdleHint() {
    clearTimeout(idleTimer);
    idleTimer = null;
    if (hintCells) { hintCells = null; renderBoard(); }
  }
  function resetIdleTimer() {
    clearIdleHint();
    idleTimer = setTimeout(() => {
      if (state.busy) { resetIdleTimer(); return; } // try again once the board settles
      hintCells = findHint(state.board);
      if (hintCells) renderBoard();
    }, IDLE_HINT_MS);
  }

  // ---------------------------------------------------------------------
  // Game flow
  // ---------------------------------------------------------------------
  async function attemptSwap(a, b) {
    if (state.busy) return;
    state.busy = true;
    swapCells(state.board, a, b);

    const hasMatch = findMatchRuns(state.board).length > 0;
    const cellA = state.board[a[0]][a[1]];
    const cellB = state.board[b[0]][b[1]];
    const isComboSwap = !hasMatch && cellA && cellB && cellA.special && cellB.special;

    if (!hasMatch && !isComboSwap) {
      swapCells(state.board, a, b); // undo
      state.selected = null;
      renderBoard();
      setMessage("No match there - try a different spot.");
      sound.invalid();
      state.busy = false;
      return;
    }

    sound.swap();
    state.selected = null;
    // Computed once per move, from how long it's been since the last one -
    // a cascade from a single swap doesn't compound the bonus per flash.
    const multiplier = currentMoveMultiplier();
    let depth = 0;
    let scoreNow = state.score;
    const steps = isComboSwap
      ? resolveComboSteps(state.board, state.score, a, b)
      : resolveBoardSteps(state.board, state.score, b);

    for await (const step of steps) {
      if (step.kind === "flash") {
        depth++;
        const bonusDelta = Math.round(step.delta * multiplier);
        scoreNow += bonusDelta;
        const big = step.combo || step.positions.length >= 8;
        const flashSet = new Set(step.positions.map(keyOf));
        renderBoard({ flashSet });
        spawnScorePopup(step.positions, bonusDelta);
        setComboMessage(depth, step.combo);
        sound.pop(depth, big);
        if (step.specialsCreated) sound.specialCreate();
        if (big) shakeBoard();
        await nextFrame();
        await sleep(FLASH_MS);
      } else if (step.kind === "popped") {
        state.score = scoreNow;
        renderHUD();
        renderBoard();
        await nextFrame();
        await sleep(SETTLE_MS * 0.4);
      } else if (step.kind === "refilled") {
        state.score = scoreNow;
        renderHUD();
        renderBoard({ dropCols: new Set(Array.from({ length: BOARD_SIZE }, (_, i) => i)) });
        await nextFrame();
        await sleep(SETTLE_MS);
      }
    }

    state.movesLeft -= 1; // reaching here always means at least one flash happened above
    renderHUD();
    renderBoard();
    state.busy = false;
    restartBonusBar();
    await checkRoundEnd();
  }

  async function checkRoundEnd() {
    if (state.score >= state.target) {
      await endRound(true);
    } else if (state.movesLeft <= 0) {
      await endRound(false);
    } else if (!findHint(state.board)) {
      await reshuffleBoard();
    }
  }

  // The board can end up with no legal move left after a cascade settles.
  // createBoard() already avoids dealing one, so this only ever fires on a
  // genuinely stuck refill - reshuffle in place rather than soft-locking
  // the round.
  async function reshuffleBoard() {
    state.busy = true;
    clearIdleHint();
    setMessage("No more moves - shuffling! \u{1F500}");
    sound.shuffle();
    await sleep(500);
    state.board = createBoard();
    renderBoard();
    state.busy = false;
    resetIdleTimer();
  }

  async function endRound(won) {
    state.busy = true;
    const stars = won ? starsForResult(state.movesLeft, state.movesTotal) : 0;
    const { starsChanged, justUnlocked } = applyLevelResult(state.profile, state.level, won, stars);
    if (won) sound.win(); else sound.lose();

    const nextBtn = document.getElementById("btn-next-level");
    const retryBtn = document.getElementById("btn-retry-level");
    if (won) {
      document.getElementById("gameover-title").textContent = starsChanged ? "Level Complete! \u{1F389}" : "Level Complete!";
      document.getElementById("gameover-sub").textContent = justUnlocked
        ? `${state.profile.name} cleared Level ${state.level} and unlocked Level ${state.level + 1}!`
        : `${state.profile.name} cleared Level ${state.level} again - nice!`;
      document.getElementById("gameover-stars").innerHTML = starsHTML(stars);
      nextBtn.hidden = false;
      retryBtn.hidden = true;
    } else {
      document.getElementById("gameover-title").textContent = "Out of moves!";
      document.getElementById("gameover-sub").textContent = `So close - ${state.score}/${state.target} points. Try Level ${state.level} again?`;
      document.getElementById("gameover-stars").innerHTML = starsHTML(0);
      nextBtn.hidden = true;
      retryBtn.hidden = false;
    }
    showOverlay("overlay-gameover");

    // Share the result in the background - deliberately not awaited: a
    // successful publish can reload the page (see saveProfiles), and the
    // modal above must already be visible before that happens, not
    // waiting on it.
    saveProfiles(state.profiles);
  }

  function newRound(levelNumber) {
    const config = levelConfig(levelNumber);
    state.level = levelNumber;
    state.target = config.target;
    state.movesTotal = config.moves;
    state.board = createBoard();
    state.cursor = [0, 0];
    state.selected = null;
    state.score = 0;
    state.movesLeft = config.moves;
    state.busy = false;
    setMessage("Good luck!");
    renderHUD();
    renderBoard();
    resetIdleTimer();
    restartBonusBar();
  }

  function moveCursor(dr, dc) {
    if (state.busy) return;
    resetIdleTimer();
    const [r, c] = state.cursor;
    state.cursor = [Math.min(BOARD_SIZE - 1, Math.max(0, r + dr)), Math.min(BOARD_SIZE - 1, Math.max(0, c + dc))];
    renderBoard();
  }

  function activateCell(pos) {
    if (state.busy) return;
    resetIdleTimer();
    if (!state.selected) {
      state.selected = pos;
      setMessage("Candy picked up! Move next to it and press Space (or tap it).");
      renderBoard();
    } else if (state.selected[0] === pos[0] && state.selected[1] === pos[1]) {
      state.selected = null;
      setMessage("Put the candy back down.");
      renderBoard();
    } else if (isAdjacent(state.selected, pos)) {
      attemptSwap(state.selected, pos);
    } else {
      state.selected = pos;
      renderBoard();
    }
  }

  // ---------------------------------------------------------------------
  // Input: keyboard
  // ---------------------------------------------------------------------
  window.addEventListener("keydown", (e) => {
    if (anyOverlayOpen()) return;
    switch (e.key) {
      case "ArrowUp": e.preventDefault(); moveCursor(-1, 0); break;
      case "ArrowDown": e.preventDefault(); moveCursor(1, 0); break;
      case "ArrowLeft": e.preventDefault(); moveCursor(0, -1); break;
      case "ArrowRight": e.preventDefault(); moveCursor(0, 1); break;
      case " ": case "Enter": e.preventDefault(); activateCell(state.cursor); break;
      case "q": case "Q": quitToLevels(); break;
    }
  });

  function quitToLevels() {
    if (state.busy) return; // don't interrupt a match animation mid-flight
    showLevelSelect();
  }
  document.getElementById("btn-quit-round").addEventListener("click", quitToLevels);

  const soundBtn = document.getElementById("btn-sound-toggle");
  function updateSoundBtn() {
    soundBtn.textContent = sound.muted ? "\u{1F507}" : "\u{1F50A}";
    soundBtn.setAttribute("aria-pressed", String(sound.muted));
  }
  soundBtn.addEventListener("click", () => {
    const isMuted = sound.toggle();
    updateSoundBtn();
    if (!isMuted) sound.pop(1, false); // quick confirmation blip when turning sound back on
  });
  updateSoundBtn();

  // ---------------------------------------------------------------------
  // Input: click + drag (mouse and touch via Pointer Events)
  // ---------------------------------------------------------------------
  let dragStart = null;
  el.board.addEventListener("pointerdown", (e) => {
    const cellEl = e.target.closest(".cell");
    if (!cellEl || state.busy) return;
    resetIdleTimer();
    const pos = [Number(cellEl.dataset.r), Number(cellEl.dataset.c)];
    state.cursor = pos;
    dragStart = { pos, x: e.clientX, y: e.clientY };
    // Capture the pointer so a finger dragged off the board (a very normal
    // slip on a small phone screen) still delivers its pointerup here,
    // instead of stranding dragStart forever.
    el.board.setPointerCapture(e.pointerId);
  });
  el.board.addEventListener("pointerup", (e) => {
    if (!dragStart) return;
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    const threshold = 18;
    let target = null;
    if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
      const [r, c] = dragStart.pos;
      if (Math.abs(dx) > Math.abs(dy)) target = [r, c + (dx > 0 ? 1 : -1)];
      else target = [r + (dy > 0 ? 1 : -1), c];
      if (target[0] < 0 || target[0] >= BOARD_SIZE || target[1] < 0 || target[1] >= BOARD_SIZE) target = null;
    }
    if (target) {
      state.selected = dragStart.pos;
      attemptSwap(dragStart.pos, target);
    } else {
      activateCell(dragStart.pos);
    }
    dragStart = null;
  });
  el.board.addEventListener("pointercancel", () => { dragStart = null; });

  // ---------------------------------------------------------------------
  // Profiles / leaderboard UI
  // ---------------------------------------------------------------------
  const overlays = ["overlay-profiles", "overlay-name", "overlay-avatar", "overlay-levels", "overlay-customize", "overlay-leaderboard", "overlay-gameover"];
  function showOverlay(id) {
    for (const o of overlays) document.getElementById(o).hidden = o !== id;
    if (id) clearIdleHint(); // the board isn't what's on screen right now
  }
  function anyOverlayOpen() {
    return overlays.some((o) => !document.getElementById(o).hidden);
  }

  function migrateProfile(p) {
    let changed = false;
    if (!p.id) { p.id = makeProfileId(); changed = true; }
    if (typeof p.highestLevelUnlocked !== "number") { p.highestLevelUnlocked = 1; changed = true; }
    if (typeof p.levelStars !== "object" || p.levelStars === null) { p.levelStars = {}; changed = true; }
    // Old avatars were an illustrated animal (string, or { base, accessories,
    // colors }); the new avatar is just a gem color choice: { color }.
    // Carry the old body color forward as a starting gem so a returning
    // player's "color" isn't reset to the same default as everyone else.
    if (!p.avatar || typeof p.avatar !== "object" || typeof p.avatar.color !== "string" || !GEM_PALETTE.some((g) => g.id === p.avatar.color)) {
      const oldBodyColor = p.avatar && typeof p.avatar === "object" && p.avatar.colors ? p.avatar.colors.body : null;
      p.avatar = { color: OLD_BODY_COLOR_TO_GEM[oldBodyColor] || "quartz" };
      changed = true;
    }
    delete p.best; // superseded by levelStars/highestLevelUnlocked
    return changed;
  }

  let confirmDeleteId = null; // profile id currently showing its "are you sure?" state

  function renderProfilePicker() {
    const list = document.getElementById("profile-list");
    list.innerHTML = "";
    for (const p of state.profiles) {
      const row = document.createElement("div");
      row.className = "profile-row-wrap";

      if (confirmDeleteId === p.id) {
        row.innerHTML = `<span class="confirm-text">Delete ${escapeHTML(p.name)}?</span>`;
        const yesBtn = document.createElement("button");
        yesBtn.className = "confirm-yes";
        yesBtn.textContent = "Delete";
        yesBtn.addEventListener("click", async () => {
          const wasMe = state.profile && state.profile.id === p.id;
          state.profiles = state.profiles.filter((x) => x.id !== p.id);
          confirmDeleteId = null;
          if (wasMe) { state.profile = null; try { localStorage.removeItem(STORE_MY_PROFILE_ID); } catch { /* ignore */ } }
          renderProfilePicker();
          await saveProfiles(state.profiles);
        });
        const noBtn = document.createElement("button");
        noBtn.className = "confirm-no";
        noBtn.textContent = "Cancel";
        noBtn.addEventListener("click", () => { confirmDeleteId = null; renderProfilePicker(); });
        row.appendChild(yesBtn);
        row.appendChild(noBtn);
      } else {
        const btn = document.createElement("button");
        btn.className = "profile-row";
        btn.innerHTML = `${avatarHTML(p.avatar, { stars: totalStars(p) })}<span>${escapeHTML(p.name)}</span>`;
        btn.addEventListener("click", () => choosePlayer(p));
        const delBtn = document.createElement("button");
        delBtn.className = "delete-profile";
        delBtn.textContent = "\u{1F5D1}\u{FE0F}";
        delBtn.title = `Delete ${p.name}`;
        delBtn.setAttribute("aria-label", `Delete ${p.name}`);
        delBtn.addEventListener("click", (e) => { e.stopPropagation(); confirmDeleteId = p.id; renderProfilePicker(); });
        row.appendChild(btn);
        row.appendChild(delBtn);
      }
      list.appendChild(row);
    }
  }
  function escapeHTML(s) { return s.replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])); }

  function choosePlayer(profile) {
    state.profile = profile;
    try { localStorage.setItem(STORE_MY_PROFILE_ID, profile.id); } catch { /* ignore */ }
    el.quitBtn.hidden = false;
    showLevelSelect();
  }

  // A level node's horizontal position follows a sine wave down the map, so
  // the path snakes left-right instead of running in a straight column.
  const LEVEL_NODE_SPACING_Y = 92;
  const LEVEL_NODE_TOP_PAD = 40;
  function levelNodeX(i) { return 50 + 30 * Math.sin(i * 0.85); }
  function levelNodeY(i) { return LEVEL_NODE_TOP_PAD + i * LEVEL_NODE_SPACING_Y; }

  // The map is divided into themed 10-level sections, cycling if a player
  // gets past the last one - purely cosmetic (a tinted band + label behind
  // the nodes), no effect on difficulty or candy types.
  const MAP_THEMES = [
    { name: "Jungle", emoji: "\u{1F334}", tint: "76, 148, 66", deco: ["\u{1F334}", "\u{1F343}", "\u{1F99C}"] },
    { name: "Space", emoji: "\u{1F680}", tint: "90, 90, 190", deco: ["\u{2B50}", "\u{1F311}", "\u{1FA90}"] },
    { name: "Farm", emoji: "\u{1F69C}", tint: "212, 158, 58", deco: ["\u{1F33E}", "\u{1F404}", "\u{1F413}"] },
    { name: "Ocean", emoji: "\u{1F30A}", tint: "42, 138, 168", deco: ["\u{1F420}", "\u{1F41A}", "\u{1F30A}"] },
    { name: "Candy Peaks", emoji: "\u{1F36D}", tint: "214, 96, 158", deco: ["\u{1F36D}", "\u{1F36C}", "\u{1F369}"] },
  ];
  function themeForLevel(n) {
    return MAP_THEMES[Math.floor((n - 1) / 10) % MAP_THEMES.length];
  }

  function showLevelSelect() {
    const profile = state.profile;
    const map = document.getElementById("level-list");

    const highest = profile.highestLevelUnlocked || 1;
    const stars = totalStars(profile);
    document.getElementById("levels-sub").textContent = stars
      ? `${profile.name} - ${stars} \u2605 collected`
      : `${profile.name} - pick a level!`;

    // Newest first: the locked teaser, then the level you'd actually tap
    // next, both right at the top - no scrolling needed to reach them.
    // Completed levels trail off below, oldest at the very bottom.
    const nodeLevels = [highest + 1, ...Array.from({ length: highest }, (_, i) => highest - i)];
    const totalHeight = LEVEL_NODE_TOP_PAD * 2 + (nodeLevels.length - 1) * LEVEL_NODE_SPACING_Y;
    map.style.height = totalHeight + "px";
    const points = nodeLevels.map((_, i) => [levelNodeX(i), levelNodeY(i)]);

    // Group consecutive same-theme nodes into one tinted band each, rather
    // than re-tinting behind every single node.
    let bandsHTML = "";
    let band = null;
    nodeLevels.forEach((n, i) => {
      const theme = themeForLevel(n);
      const y = points[i][1];
      if (band && band.theme === theme) {
        band.minY = Math.min(band.minY, y);
        band.maxY = Math.max(band.maxY, y);
      } else {
        if (band) bandsHTML += renderThemeBand(band);
        band = { theme, minY: y, maxY: y };
      }
    });
    if (band) bandsHTML += renderThemeBand(band);
    function renderThemeBand(b) {
      const top = b.minY - LEVEL_NODE_SPACING_Y / 2;
      const height = b.maxY - b.minY + LEVEL_NODE_SPACING_Y;
      // A handful of large, faint theme emoji scattered down the band - a
      // real (if cheap) themed background rather than just a flat tint.
      const decoCount = Math.max(2, Math.round(height / 100));
      let decoHTML = "";
      for (let i = 0; i < decoCount; i++) {
        const emoji = b.theme.deco[i % b.theme.deco.length];
        const yPct = ((i + 0.5) / decoCount) * 100;
        const xPct = i % 2 === 0 ? 14 : 84;
        decoHTML += `<span class="map-theme-deco" style="top:${yPct}%;left:${xPct}%;">${emoji}</span>`;
      }
      return `<div class="map-theme-band" style="top:${top}px;height:${height}px;background:rgba(${b.theme.tint},0.12);">
        ${decoHTML}
        <span class="map-theme-label">${b.theme.emoji} ${b.theme.name}</span>
      </div>`;
    }

    map.innerHTML = bandsHTML + `<svg class="level-path" viewBox="0 0 100 ${totalHeight}" preserveAspectRatio="none" width="100%" height="${totalHeight}" aria-hidden="true">
      <polyline points="${points.map((p) => p.join(",")).join(" ")}" fill="none" stroke="var(--panel-line)" stroke-width="1.5" stroke-dasharray="1.5 3.5" stroke-linecap="round"/>
    </svg>`;

    nodeLevels.forEach((n, i) => {
      const [x, y] = points[i];
      if (n > highest) {
        // The next level to unlock - shown, but not playable yet.
        const nextCfg = levelConfig(n);
        const lockedBtn = document.createElement("button");
        lockedBtn.className = "level-node locked";
        lockedBtn.style.left = x + "%";
        lockedBtn.style.top = y + "px";
        lockedBtn.disabled = true;
        lockedBtn.title = `Clear Level ${highest} to unlock - reach ${nextCfg.target} pts`;
        lockedBtn.innerHTML = `<span class="num">\u{1F512}</span>`;
        map.appendChild(lockedBtn);
        return;
      }
      const cfg = levelConfig(n);
      const earnedStars = (profile.levelStars || {})[n] || 0;
      const btn = document.createElement("button");
      btn.className = "level-node" + (earnedStars > 0 ? " cleared" : "") + (n === highest ? " next" : "");
      btn.style.left = x + "%";
      btn.style.top = y + "px";
      btn.title = `Level ${n} - reach ${cfg.target} pts in ${cfg.moves} moves`;
      btn.innerHTML = `<span class="num">${n}</span><span class="mini-stars">${starsHTML(earnedStars)}</span>`;
      btn.addEventListener("click", () => {
        showOverlay(null);
        newRound(n);
      });
      map.appendChild(btn);
    });

    // Where everyone else in the family currently is, so the map doubles as
    // a live "you are here" view of the whole household - not just yours.
    // Clamped to this map's own visible range (this player's own locked
    // teaser at most), since that's as far as the path is drawn here.
    state.profiles
      .filter((p) => p.id !== profile.id)
      .forEach((other, oi) => {
        const otherLevel = Math.min(other.highestLevelUnlocked || 1, highest + 1);
        const idx = nodeLevels.indexOf(otherLevel);
        if (idx === -1) return;
        const [x, y] = points[idx];
        const marker = document.createElement("div");
        marker.className = "player-marker";
        marker.style.left = x + "%";
        marker.style.top = y + "px";
        // Stacked vertically (not side by side) so the pill's width, which
        // varies with name length, never overlaps a sibling marker.
        marker.style.transform = `translate(-50%, -50%) translate(32px, ${-6 - oi * 24}px)`;
        marker.title = `${other.name} - Level ${other.highestLevelUnlocked || 1}`;
        marker.innerHTML = `${avatarHTML(other.avatar, { stars: totalStars(other) })}<span>${escapeHTML(other.name)}</span>`;
        map.appendChild(marker);
      });

    map.scrollTop = 0; // always land at the top (the newest levels), even on reopen

    showOverlay("overlay-levels");
  }

  function showCustomizeAvatar() {
    const profile = state.profile;
    const earned = totalStars(profile);
    const current = normalizeAvatar(profile.avatar);
    state.pendingGem = current.color;

    document.getElementById("customize-sub").textContent = `${earned} ★ earned - tap a gem to choose it`;

    function renderPreview() {
      document.getElementById("avatar-preview").innerHTML = avatarHTML({ color: state.pendingGem }, { full: true, stars: earned });
    }

    const row = document.getElementById("cosmetic-slots");
    function renderRow() {
      row.innerHTML = "";
      for (const g of GEM_PALETTE) {
        const unlocked = earned >= g.unlockStars;
        const btn = document.createElement("button");
        btn.className = "cosmetic-item" + (unlocked ? "" : " locked") + (state.pendingGem === g.id ? " equipped" : "");
        btn.title = g.label;
        btn.innerHTML = unlocked
          ? avatarHTML({ color: g.id }, { stars: 0 })
          : `\u{1F512}<span class="req">${g.unlockStars}★</span>`;
        btn.disabled = !unlocked;
        if (unlocked) {
          btn.addEventListener("click", () => {
            state.pendingGem = g.id;
            renderRow();
            renderPreview();
          });
        }
        row.appendChild(btn);
      }
    }
    renderRow();
    renderPreview();
    showOverlay("overlay-customize");
  }

  function showLeaderboard() {
    const profiles = [...state.profiles].sort(
      (a, b) => totalStars(b) - totalStars(a) || (b.highestLevelUnlocked || 1) - (a.highestLevelUnlocked || 1)
    );

    const list = document.getElementById("leaderboard-list");
    list.innerHTML = "";
    if (!profiles.length) {
      list.innerHTML = `<li class="empty">No players yet!</li>`;
    }
    profiles.forEach((p, i) => {
      const li = document.createElement("li");
      if (state.profile && p.id === state.profile.id) li.classList.add("mine");
      const highest = p.highestLevelUnlocked || 1;
      li.innerHTML = `<span class="rank">${i + 1}</span>${avatarHTML(p.avatar, { stars: totalStars(p) })}<div class="name">${escapeHTML(p.name)}<div class="level-tag">Level ${highest}</div></div><span class="pts">${totalStars(p)} \u2605</span>`;
      list.appendChild(li);
    });
    showOverlay("overlay-leaderboard");
  }

  document.getElementById("btn-new-player").addEventListener("click", () => {
    document.getElementById("name-input").value = "";
    showOverlay("overlay-name");
    document.getElementById("name-input").focus();
  });

  document.getElementById("name-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("btn-name-next").click();
  });

  document.getElementById("btn-name-next").addEventListener("click", () => {
    const name = document.getElementById("name-input").value.trim().slice(0, 14);
    state.pendingName = name || "Player";
    state.pendingGem = GEM_PALETTE.find((g) => g.unlockStars === 0).id;
    renderAvatarGrid();
    document.getElementById("avatar-sub").textContent = `Choose one, ${state.pendingName}!`;
    showOverlay("overlay-avatar");
  });

  function renderAvatarGrid() {
    const grid = document.getElementById("avatar-grid");
    grid.innerHTML = "";
    GEM_PALETTE.filter((g) => g.unlockStars === 0).forEach((g) => {
      const btn = document.createElement("button");
      btn.className = "avatar-pick" + (state.pendingGem === g.id ? " chosen" : "");
      btn.title = g.label;
      btn.innerHTML = avatarHTML({ color: g.id }, { stars: 0 });
      btn.addEventListener("click", () => {
        state.pendingGem = g.id;
        renderAvatarGrid();
      });
      grid.appendChild(btn);
    });
  }

  document.getElementById("btn-avatar-confirm").addEventListener("click", async () => {
    const profile = {
      id: makeProfileId(),
      name: state.pendingName,
      avatar: { color: state.pendingGem },
      highestLevelUnlocked: 1,
      levelStars: {},
    };
    state.profiles.push(profile);
    // Set this before saving: a successful publish reloads the page, so
    // anything after that call may never run - see PUBLISHING above.
    try { localStorage.setItem(STORE_MY_PROFILE_ID, profile.id); } catch { /* ignore */ }
    await saveProfiles(state.profiles);
    choosePlayer(profile);
  });

  document.getElementById("btn-switch-player").addEventListener("click", () => {
    renderProfilePicker();
    showOverlay("overlay-profiles");
  });

  document.getElementById("btn-show-leaderboard").addEventListener("click", showLeaderboard);
  document.getElementById("btn-close-leaderboard").addEventListener("click", showLevelSelect);

  document.getElementById("btn-open-customize").addEventListener("click", showCustomizeAvatar);
  document.getElementById("btn-customize-cancel").addEventListener("click", showLevelSelect);
  document.getElementById("btn-customize-save").addEventListener("click", async () => {
    state.profile.avatar = { color: state.pendingGem };
    showLevelSelect(); // reflect the change immediately, before the save (see PUBLISHING)
    await saveProfiles(state.profiles);
  });

  document.getElementById("btn-next-level").addEventListener("click", () => {
    showOverlay(null);
    newRound(state.level + 1);
  });
  document.getElementById("btn-retry-level").addEventListener("click", () => {
    showOverlay(null);
    newRound(state.level);
  });
  document.getElementById("btn-to-levels").addEventListener("click", showLevelSelect);

  // ---------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------
  state.profiles = loadInitialProfiles();
  for (const p of state.profiles) migrateProfile(p);

  function tryAutoResume() {
    let myId = null;
    try { myId = localStorage.getItem(STORE_MY_PROFILE_ID); } catch { /* ignore */ }
    if (!myId) return false;
    const found = state.profiles.find((p) => p.id === myId);
    if (!found) return false;
    choosePlayer(found); // e.g. resuming right after a level-complete publish reloaded the page
    return true;
  }

  if (!tryAutoResume()) {
    renderProfilePicker();
    showOverlay("overlay-profiles");
  }
})();
</script>
