<meta charset="utf-8">
<title>Gumdrop Cascade</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">

<style>
  :root {
    --bg: #f6f1ff;
    --bg-glow: #ffffff;
    --panel: #ffffff;
    --panel-line: #e6dbf9;
    --ink: #2c2148;
    --muted: #7c6f9c;
    --accent: #e23e90;
    --accent-ink: #ffffff;
    --accent-soft: #fbe4f1;
    --shadow: 222deg 45% 30%;

    --c-circle: #ef5364;
    --c-circle-d: #c73348;
    --c-square: #2fbf78;
    --c-square-d: #1f9860;
    --c-triangle: #ffbe3d;
    --c-triangle-d: #e69518;
    --c-diamond: #4c8cf0;
    --c-diamond-d: #2f66c9;
    --c-cross: #b36bf0;
    --c-cross-d: #8a45c9;

    --power-row: #ffb703;
    --power-col: #21c3e0;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #180f2a;
      --bg-glow: #241640;
      --panel: #221439;
      --panel-line: #3c2a5c;
      --ink: #f3ecff;
      --muted: #a598c4;
      --accent: #ff5fac;
      --accent-ink: #2a0e1f;
      --accent-soft: #3a1f38;
      --shadow: 260deg 60% 4%;
    }
  }

  :root[data-theme="dark"] {
    --bg: #180f2a;
    --bg-glow: #241640;
    --panel: #221439;
    --panel-line: #3c2a5c;
    --ink: #f3ecff;
    --muted: #a598c4;
    --accent: #ff5fac;
    --accent-ink: #2a0e1f;
    --accent-soft: #3a1f38;
    --shadow: 260deg 60% 4%;
  }

  * { box-sizing: border-box; }

  /* Exactly one scroll region at a time: whichever modal is open (or the
     board itself, as a last resort on very short screens) - never the
     page underneath it too. */
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }

  body {
    margin: 0;
    background: radial-gradient(circle at 50% -10%, var(--bg-glow), var(--bg) 60%);
    color: var(--ink);
    font-family: "Nunito", ui-sans-serif, system-ui, sans-serif;
  }

  /* Always full-bleed - phone, tablet, or desktop window - rather than a
     "card floating on a background" with visible margins on every side.
     The game's own content (header/board/footer) is what gets a width cap
     below, not this outer shell, so a huge monitor doesn't stretch the
     board itself into something absurd while the background still reaches
     every edge. */
  .cabinet {
    width: 100%;
    height: 100vh; /* fallback for browsers that don't understand dvh at all */
    height: 100dvh;
    background: var(--panel);
    padding: clamp(16px, 3vw, 28px);
    position: relative;
    overflow-y: auto; /* fallback only - the board itself should always fit */
    touch-action: pan-y; /* re-allow scrolling here despite html/body's blanket touch-action:none */
  }

  /* The actual game content stays a comfortable width and centered even
     though .cabinet itself now always spans the full window. */
  .header, .board-wrap, .footer {
    width: 100%;
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
  }

  /* Some iOS Safari versions don't reliably resolve `aspect-ratio` at all
     (even moved off the grid itself, onto this plain wrapper - see the
     mobile bug this fixes, and the one before it), so the board stretches
     way past the viewport instead of staying square. The padding-bottom
     trick below computes the square from width alone, with no dependency
     on aspect-ratio support, so it works everywhere. */
  .board-wrap {
    position: relative;
    width: 100%;
    height: 0;
    padding-bottom: 100%;
  }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  h1 {
    font-family: "Baloo 2", ui-rounded, sans-serif;
    font-weight: 800;
    font-size: clamp(1.3rem, 4vw, 1.7rem);
    margin: 0;
    letter-spacing: 0.01em;
    text-wrap: balance;
    color: var(--accent);
  }

  .stats {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .stat {
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 5px 10px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.78rem;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    display: flex;
    gap: 5px;
    align-items: baseline;
  }
  .stat b { color: var(--accent); font-size: 0.95rem; }
  .stat.stat-warn { animation: stat-warn-pulse 1s ease-in-out infinite; }
  .stat.stat-warn b { color: #c0324f; }
  @keyframes stat-warn-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  /* A small round icon-only button - the in-game "back to levels" control,
     and the customize/leaderboard/switch-player row on the level map, so
     none of them need a full text label taking up space. */
  .icon-btn {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    font-size: 1.2rem;
    line-height: 1;
    border-radius: 50%;
    border: 2px solid var(--panel-line);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    touch-action: manipulation;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover, .icon-btn:focus-visible { border-color: var(--accent); }

  /* One SVG gem per player (see gemSVG/avatarHTML): "small" is the compact
     size used everywhere space is tight, "full" is the big customize-screen
     preview. Same viewBox either way - just a size swap. */
  .avatar-stack {
    display: inline-block;
    line-height: 1;
    vertical-align: middle;
  }
  .avatar-svg {
    display: block;
    filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.25));
  }
  .avatar-stack.small .avatar-svg { width: 30px; height: 30px; }
  .avatar-stack.full .avatar-svg { width: 150px; height: 150px; overflow: visible; }
  .gem-live { animation: gem-breathe 2.6s ease-in-out infinite; transform-origin: center; }
  @keyframes gem-breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045); }
  }
  .gem-sparkle {
    transform-box: fill-box;
    transform-origin: center;
    animation: gem-sparkle-twinkle 1.8s ease-in-out infinite;
  }
  @keyframes gem-sparkle-twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.7); }
    50% { opacity: 1; transform: scale(1.15); }
  }
  .gem-orbit {
    transform-box: view-box;
    transform-origin: 50px 48px;
    animation: gem-orbit-spin 7s linear infinite;
  }
  @keyframes gem-orbit-spin { to { transform: rotate(360deg); } }
  .gem-aura {
    transform-box: view-box;
    transform-origin: 50px 48px;
    animation: gem-aura-spin 9s linear infinite;
  }
  @keyframes gem-aura-spin { to { transform: rotate(360deg); } }

  .board {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: clamp(3px, 0.8vw, 6px);
    background: var(--panel-line);
    border-radius: 18px;
    padding: clamp(6px, 1.4vw, 10px);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .cell {
    position: relative;
    background: color-mix(in srgb, var(--panel) 88%, var(--panel-line));
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    outline: 3px solid transparent;
    outline-offset: -3px;
    transition: outline-color 120ms ease, background 120ms ease;
  }
  .cell.cursor { outline-color: var(--accent); }
  .cell.selected { background: color-mix(in srgb, var(--accent) 22%, var(--panel)); }

  .candy {
    width: 74%;
    height: 74%;
    position: relative;
    cursor: grab;
    filter: drop-shadow(0 3px 3px hsl(var(--shadow) / 0.35));
    transition: transform 140ms cubic-bezier(.34,1.56,.64,1);
  }
  .candy:active { cursor: grabbing; }
  .candy.flash { animation: pop-flash 220ms ease-in-out; }
  .candy.dropping { animation: drop-in 260ms cubic-bezier(.2,.8,.3,1.1); }
  .candy.popping { animation: pop-out 200ms ease-in forwards; }
  .candy.hint { animation: hint-pulse 1s ease-in-out infinite; }
  @keyframes hint-pulse {
    0%, 100% { filter: drop-shadow(0 3px 3px hsl(var(--shadow) / 0.35)) brightness(1); }
    50% { filter: drop-shadow(0 3px 3px hsl(var(--shadow) / 0.35)) brightness(1.4); }
  }

  @keyframes pop-flash {
    0%, 100% { filter: drop-shadow(0 3px 3px hsl(var(--shadow) / 0.35)) brightness(1); transform: scale(1); }
    50% { filter: drop-shadow(0 3px 3px hsl(var(--shadow) / 0.35)) brightness(1.9); transform: scale(1.18); }
  }
  @keyframes drop-in {
    0% { transform: translateY(-130%); opacity: 0.2; }
    100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes pop-out {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.2); opacity: 0; }
  }

  .shape { width: 100%; height: 100%; display: block; }

  .power-ring {
    position: absolute;
    inset: -14%;
    border-radius: 50%;
    pointer-events: none;
    animation: ring-pulse 1.3s ease-in-out infinite;
  }
  .power-ring.row { box-shadow: 0 0 0 3px var(--power-row); }
  .power-ring.col { box-shadow: 0 0 0 3px var(--power-col); }
  .power-ring.bomb {
    background: conic-gradient(from 0deg, #ff5fac, #ffd23f, #4c8cf0, #ff5fac);
    opacity: 0.55;
    animation: ring-pulse 1.3s ease-in-out infinite, spin 2.4s linear infinite;
  }
  @keyframes ring-pulse {
    0%, 100% { opacity: 0.35; transform: scale(0.94); }
    50% { opacity: 0.9; transform: scale(1.08); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Floating "+N" text where a match just cleared. */
  .score-popup {
    position: absolute;
    transform: translate(-50%, -50%);
    font-family: "Baloo 2", sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    color: var(--accent);
    text-shadow: 0 1px 0 var(--panel), 0 2px 6px rgba(0, 0, 0, 0.25);
    pointer-events: none;
    white-space: nowrap;
    animation: score-float 900ms ease-out forwards;
    z-index: 5;
  }
  @keyframes score-float {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    100% { opacity: 0; transform: translate(-50%, -170%) scale(1); }
  }

  /* A brief wiggle on a big or combo clear. */
  .board.shake { animation: board-shake 320ms ease; }
  @keyframes board-shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-6px, 2px); }
    40% { transform: translate(5px, -3px); }
    60% { transform: translate(-4px, 3px); }
    80% { transform: translate(3px, -2px); }
  }

  /* Escalating combo callout ("Sweet!" -> "SUGAR RUSH!") pulses in. */
  .message.combo { animation: combo-pop 260ms ease; }
  @keyframes combo-pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  .sound-toggle {
    font-size: 1.1rem;
    line-height: 1;
    background: transparent;
    border: 2px solid var(--panel-line);
    border-radius: 10px;
    padding: 4px 8px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .sound-toggle:hover, .sound-toggle:focus-visible { border-color: var(--accent); }

  .footer {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  /* Fills right after every move, then drains over BONUS_WINDOW_MS - swap
     again before it empties for a score bonus (see attemptSwap /
     currentMoveMultiplier). Driven directly from JS (restartBonusBar), not
     a CSS animation, so the countdown label under it can stay in sync.
     Purely a speed reward: taking your time never costs anything, it just
     skips the bonus. */
  .bonus-bar-track {
    width: 100%;
    height: 8px;
    border-radius: 999px;
    background: var(--panel-line);
    overflow: hidden;
  }
  .bonus-bar-fill {
    height: 100%;
    width: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--power-row), var(--accent));
    transform-origin: left;
    transform: scaleX(1);
  }
  .bonus-label {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.7rem;
    color: var(--muted);
    text-align: center;
    min-height: 1.2em;
    font-variant-numeric: tabular-nums;
  }
  .message {
    font-weight: 700;
    color: var(--accent);
    min-height: 1.2em;
    font-size: 0.92rem;
  }
  /* --- overlay modals --- */
  .overlay {
    position: absolute;
    inset: 0;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(6px);
    border-radius: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .overlay[hidden] { display: none; }

  .modal {
    background: var(--panel);
    border: 3px solid var(--panel-line);
    border-radius: 20px;
    padding: 22px;
    width: min(380px, 100%);
    max-height: min(85vh, 640px);
    overflow-y: auto;
    text-align: center;
  }
  .modal h2 {
    font-family: "Baloo 2", sans-serif;
    font-size: 1.3rem;
    margin: 0 0 4px;
    color: var(--accent);
  }
  .modal p.sub { color: var(--muted); margin: 0 0 16px; font-size: 0.88rem; }

  .profile-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }
  .profile-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 14px;
    border-radius: 12px;
    border: 2px solid var(--panel-line);
    background: transparent;
    font: inherit;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    touch-action: manipulation;
  }
  .profile-row:hover, .profile-row:focus-visible { border-color: var(--accent); background: var(--accent-soft); }
  .profile-row-wrap { display: flex; gap: 8px; align-items: stretch; }
  .profile-row-wrap .profile-row { flex: 1; }
  .delete-profile {
    flex-shrink: 0;
    width: 44px;
    border-radius: 12px;
    border: 2px solid var(--panel-line);
    background: transparent;
    font-size: 1.1rem;
    cursor: pointer;
    touch-action: manipulation;
  }
  .delete-profile:hover { border-color: #c0324f; background: color-mix(in srgb, #c0324f 15%, transparent); }
  .confirm-text {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 0 4px;
    font-weight: 700;
    color: var(--ink);
  }
  .confirm-yes {
    background: #c0324f;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 10px 14px;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
  }
  .confirm-no {
    background: transparent;
    border: 2px solid var(--panel-line);
    border-radius: 12px;
    padding: 10px 14px;
    font: inherit;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    touch-action: manipulation;
  }
  .profile-row .avatar-stack { font-size: 1.4rem; }
  .profile-row .new-label { color: var(--accent); }

  .btn {
    font: inherit;
    font-family: "Baloo 2", sans-serif;
    font-weight: 700;
    font-size: 1rem;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 14px;
    padding: 14px 20px;
    cursor: pointer;
    width: 100%;
    touch-action: manipulation;
    transition: transform 100ms ease, filter 100ms ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible, .profile-row:focus-visible, input:focus-visible, .avatar-pick:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--muted); border: 2px solid var(--panel-line); margin-top: 8px; }

  input[type="text"] {
    font: inherit;
    font-size: 1rem;
    width: 100%;
    padding: 10px 12px;
    border-radius: 12px;
    border: 2px solid var(--panel-line);
    background: color-mix(in srgb, var(--panel) 96%, var(--panel-line));
    color: var(--ink);
    margin-bottom: 14px;
  }

  .avatar-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .avatar-pick {
    padding: 12px 0;
    border-radius: 12px;
    border: 2px solid var(--panel-line);
    background: transparent;
    cursor: pointer;
    touch-action: manipulation;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .avatar-pick.chosen { border-color: var(--accent); background: var(--accent-soft); }

  .avatar-preview {
    display: flex;
    justify-content: center;
    margin: 6px 0 18px;
  }
  .cosmetic-slots {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
  }
  .cosmetic-item {
    position: relative;
    font-size: 1.4rem;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    border: 2px solid var(--panel-line);
    background: color-mix(in srgb, var(--panel) 80%, white); /* neutral backing so dark-colored gear stays visible */
    cursor: pointer;
    touch-action: manipulation;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cosmetic-item.equipped { border-color: var(--accent); background: var(--accent-soft); }
  .cosmetic-item.locked { opacity: 0.4; cursor: not-allowed; font-size: 1.1rem; }
  .cosmetic-item .req {
    position: absolute;
    bottom: -6px;
    right: -6px;
    font-family: "JetBrains Mono";
    font-size: 0.55rem;
    background: var(--panel-line);
    color: var(--ink);
    border-radius: 6px;
    padding: 1px 3px;
  }

  .leaderboard {
    list-style: none;
    margin: 0 0 16px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-align: left;
  }
  .leaderboard li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 10px;
    background: color-mix(in srgb, var(--panel) 90%, var(--panel-line));
    border: 2px solid transparent;
  }
  .leaderboard li.mine {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .leaderboard .rank { font-family: "JetBrains Mono"; color: var(--muted); width: 1.4em; }
  .leaderboard .avatar-stack { font-size: 1.4rem; }
  .leaderboard .name { flex: 1; font-weight: 700; }
  .leaderboard .pts { font-family: "JetBrains Mono"; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .leaderboard .empty { color: var(--muted); text-align: center; padding: 10px; }
  .leaderboard .level-tag { font-size: 0.72rem; color: var(--muted); }

  .stars { font-size: 0.9rem; letter-spacing: 1px; white-space: nowrap; }
  .stars .lit { color: var(--power-row); }
  .stars .dim { color: var(--panel-line); }
  .star-row {
    font-size: 2.2rem;
    letter-spacing: 6px;
    text-align: center;
    margin: 4px 0 16px;
  }
  .star-row .lit { color: var(--power-row); text-shadow: 0 0 14px color-mix(in srgb, var(--power-row) 60%, transparent); }
  .star-row .dim { color: var(--panel-line); }

  /* A winding path of level nodes (see showLevelSelect) rather than a plain
     list - each node's horizontal position comes from a sine wave, so the
     path snakes down the modal instead of running in a straight column. */
  .level-map {
    position: relative;
    margin: 0 0 14px;
    max-height: 46vh;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none; /* Firefox - still scrolls, just no visible track/thumb */
    -ms-overflow-style: none;
  }
  .level-map::-webkit-scrollbar { display: none; } /* Chrome/Safari */
  .level-actions {
    display: flex;
    justify-content: center;
    gap: 14px;
  }
  .level-path { position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none; }
  /* One tinted band per themed section (see MAP_THEMES) - purely cosmetic
     scenery behind the path, grouping levels into "worlds" like a real map. */
  .map-theme-band {
    position: absolute;
    left: 0;
    right: 0;
    z-index: 0;
    pointer-events: none;
  }
  .map-theme-label {
    display: inline-block;
    margin: 8px 0 0 10px;
    padding: 3px 10px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--panel) 82%, black 6%);
    border: 1px solid var(--panel-line);
    font-family: "Baloo 2", sans-serif;
    font-weight: 700;
    font-size: 0.72rem;
    color: var(--muted);
  }
  /* Scattered decorative emoji per theme (see MAP_THEMES) - a cheap but
     real "themed background" rather than just a flat tint. */
  .map-theme-deco {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: 1.7rem;
    opacity: 0.2;
    pointer-events: none;
  }
  /* Where another family member currently is, layered on this player's map -
     the gem plus their name, not just an unlabeled icon. */
  .player-marker {
    position: absolute;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 2px 7px 2px 3px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--panel) 88%, black 8%);
    border: 1px solid var(--panel-line);
    pointer-events: none;
    white-space: nowrap;
    font-family: "Baloo 2", sans-serif;

<script>

  "use strict";

  // ---------------------------------------------------------------------
  // Pristine template capture (must run before anything else touches the
  // DOM). Republishing a shared update needs a genuine full document, not
  // a snapshot of the live/mutated page - see PUBLISHING below.
  //
  // This file has no explicit <head>/<body> tags (by design, for the
  // Artifact tool's authoring style), which means the HTML5 parser's
  // implied-head algorithm quietly sorts <style> and <script> tags that
  // appear before the first real body element (the .cabinet div) into an

  // it's written right next to the body markup. getElementById() still

  // never contains it - so it's captured separately here, explicitly.
  // ---------------------------------------------------------------------
  // Defensively strip any shared-state tag that ended up inside body (a
  // page generation built before the head/body fix above could have baked

  // would keep carrying that orphan forward unchanged).
  const PRISTINE_BODY_HTML = document.body.innerHTML.replace(
    /<script id="shared-state" type="application\/json">[\s\S]*?<\/script>/g,
    ""

  const STYLE_TAG_HTML = document.querySelector("style").outerHTML;
  const STATE_TAG_HTML = document.getElementById("shared-state").outerHTML;

  // ---------------------------------------------------------------------
  // Config
  // ---------------------------------------------------------------------
  const BOARD_SIZE = 8;
  const CANDY_TYPES = ["circle", "square", "triangle", "diamond", "cross"];

  const FLASH_MS = 220;
  const SETTLE_MS = 260;

  // ---------------------------------------------------------------------
  // Levels: a hand-tuned ladder for the first 10, then a gentle formula so
  // there's always a next level however far a player gets.
  // ---------------------------------------------------------------------
  // Tuned against measured play, not guesswork: even fully random adjacent
  // swaps median ~930 pts in 12 moves and ~1410 pts in 20 (see calibration
  // notes). Early levels sit below that so a beginner wins comfortably;
  // later levels sit at/above the high end so real skill (spotting matches,
  // setting up power candies) is required, not just moves.
  const LEVEL_TABLE = [
    { target: 550, moves: 10 },
    { target: 750, moves: 12 },
    { target: 950, moves: 13 },
    { target: 1150, moves: 14 },
    { target: 1350, moves: 15 },
    { target: 1550, moves: 16 },
    { target: 1750, moves: 17 },
    { target: 1950, moves: 18 },
    { target: 2150, moves: 19 },
    { target: 2400, moves: 20 },
  ];
  function levelConfig(n) {
    if (n <= LEVEL_TABLE.length) return LEVEL_TABLE[n - 1];
    const extra = n - LEVEL_TABLE.length;
    return { target: 2400 + extra * 300, moves: Math.min(20 + Math.ceil(extra / 2), 30) };
  }
  // Stars are about how comfortably you won, not just whether you did.
  function starsForResult(movesLeft, totalMoves) {
    const spare = movesLeft / totalMoves;
    if (spare >= 0.5) return 3;
    if (spare >= 0.25) return 2;
    return 1;
  }
  function totalStars(profile) {
    return Object.values(profile.levelStars || {}).reduce((sum, n) => sum + n, 0);
  }

  // ---------------------------------------------------------------------
  // Shared state & publishing

  // The player roster (profiles, level progress, avatars) is meant to be
  // shared live across everyone's devices - a laptop and a phone open on
  // the same artifact should see the same leaderboard. That needs the
  // `artifact` runtime capability: this page republishes ITSELF (the full
  // document, with updated state embedded) whenever something worth
  // sharing happens, and the platform reloads every open view to match.
  //
  // When that capability isn't available (opened as a bare local file,
  // during development, or a viewer without edit access) everything still
  // works using this browser's own localStorage - just not shared.
  // ---------------------------------------------------------------------

  const STORE_MY_PROFILE_ID = "gumdropCascade.myProfileId";

  // A capability's `use()` promise can take a moment to resolve (the doc
  // says up to ~10s worst case) - awaiting THIS promise (memoized, so
  // cheap to await repeatedly) instead of racing a synchronous variable
  // means a save that happens quickly after load still waits for the real
  // answer instead of silently falling back to local-only storage.

    typeof window.claude !== "undefined" && typeof window.claude.use === "function"

  }

    try {
      const tag = document.getElementById("shared-state");
      const data = JSON.parse(tag.textContent || "{}");

    } catch { return { profiles: [] }; }

  function loadInitialProfiles() {
    const embedded = readEmbeddedState();
    if (embedded.profiles.length) return embedded.profiles;

    // browser has saved locally (mainly useful for local development).

  // the platform's own runtime frame is NOT something we should round-trip,
  // so this reconstructs a plain document from the page's own pristine
  // parts (captured before any rendering touched the DOM) plus the new
  // state, rather than serializing the live/mutated page.

      /(<script id="shared-state" type="application\/json">)([\s\S]*?)(<\/script>)/,
      (_m, open, _old, close) => open + json + close

      "<!doctype html>\n<html><head>" +
      '<meta charset="utf-8">' +
      "<title>Gumdrop Cascade</title>" +
      '<meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">' +

  // might fix (offline, or the capability just hasn't loaded yet) - NOT for
  // a conflict (the shell is already reloading to the winner) or a
  // permissions issue (retrying won't help). Drives the "online" listener
  // below: this device's real progress is never lost, just held locally
  // until it can actually reach the shared leaderboard again.
  let pendingSync = false;

  // The single place that persists a change to the roster. Optimistically
  // updates in-memory state first (so the UI reacts immediately), then
  // tries to share it; falls back to a local-only save if sharing isn't
  // possible right now.
  async function saveProfiles(profiles) {
    state.profiles = profiles;
    const artifactCap = writeDisabled ? null : await artifactCapPromise;
    if (artifactCap && !writeDisabled) {
      try {
        await artifactCap.publish(buildFullDocument({ profiles }));
        // Success reloads every open view (this one included) to the new
        // version - there is nothing further to do here.
        pendingSync = false;
        return { ok: true };
      } catch (err) {
        const code = err && err.code;
        if (code === "not_writer" || code === "not_granted") {
          writeDisabled = true;
          setMessage("You're viewing read-only - ask to be made an editor to save progress.");
        } else if (code !== "conflict") {
          pendingSync = true;
        }
        // conflict: the shell is already reloading to the winning version.
        // Anything else: transient failure. Either way, keep a local copy
        // so this device doesn't lose the result even if it can't share it.
        saveList(STORE_PROFILES_FALLBACK, profiles);
        return { ok: false, code };

    saveList(STORE_PROFILES_FALLBACK, profiles);
    return { ok: false, code: "no-capability" };

  // device's own storage); this just means a result doesn't stay stranded
  // here once the connection comes back.

  // persist). Returns { starsChanged, justUnlocked } for the calling UI.
  // Persistence is a separate, deliberately un-awaited step (see endRound):

  // the result must already be showing before that happens, not waiting
  // on it - per the artifact capability's own "publish is the last act of
  // an interaction" guidance.

    if (!stored) return { starsChanged: false, justUnlocked: false };

    stored.levelStars = stored.levelStars || {};
    const previousStars = stored.levelStars[level] || 0;
    let starsChanged = false;
    if (won && stars > previousStars) {

      starsChanged = true;
    }
    let justUnlocked = false;
    if (won && stored.highestLevelUnlocked <= level) {
      stored.highestLevelUnlocked = level + 1;
      justUnlocked = true;

    profile.highestLevelUnlocked = stored.highestLevelUnlocked;

  // so it lives in localStorage rather than the shared profile roster.
  // The AudioContext is created lazily on first use, from inside a real

  // ---------------------------------------------------------------------

  const sound = (() => {
    let ctx = null;
    let muted = false;
    try { muted = localStorage.getItem(SOUND_MUTE_KEY) === "1"; } catch { /* ignore */ }

      if (!ctx) ctx = new AC();
      if (ctx.state === "suspended") ctx.resume();

      const c = ensureCtx();
      if (!c) return;
      const t0 = c.currentTime + delay;
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(gain, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g).connect(c.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    }

    return {
      get muted() { return muted; },
      toggle() {

      },
      swap() { tone({ freq: 340, dur: 0.06, type: "triangle", gain: 0.1 }); },
      invalid() { tone({ freq: 160, dur: 0.14, type: "sawtooth", gain: 0.08, slideTo: 110 }); },
      // Pitch rises a little with cascade depth so a chain feels like it's
      // building; `big` (a large or special-combo clear) adds a second,
      // fuller layer underneath.
      pop(depth, big) {

        tone({ freq: NOTE.C6, dur: 0.16, type: "sine", gain: 0.14, delay: 0.12 });
      },
      win() {
        [NOTE.C5, NOTE.E5, NOTE.G5, NOTE.C6].forEach((f, i) => tone({ freq: f, dur: 0.22, type: "triangle", gain: 0.15, delay: i * 0.1 }));
      },
      lose() { tone({ freq: NOTE.A4, dur: 0.4, type: "sine", gain: 0.12, slideTo: 220 }); },
      shuffle() {

  // Game logic (ported 1:1 from the original terminal prototype)
  // ---------------------------------------------------------------------
  function randomCandy() {
    return { type: CANDY_TYPES[Math.floor(Math.random() * CANDY_TYPES.length)], special: null };
  }

  function findMatchRuns(board) {
    const runs = [];
    for (let r = 0; r < BOARD_SIZE; r++) {
      let start = 0;
      for (let c = 1; c <= BOARD_SIZE; c++) {
        const same = c < BOARD_SIZE && board[r][c] && board[r][start] && board[r][c].type === board[r][start].type;
        if (!same) {
          if (c - start >= 3) {
            const cells = [];
            for (let cc = start; cc < c; cc++) cells.push([r, cc]);
            runs.push({ cells, dir: "row" });
          }
          start = c;
        }
      }
    }
    for (let c = 0; c < BOARD_SIZE; c++) {
      let start = 0;
      for (let r = 1; r <= BOARD_SIZE; r++) {
        const same = r < BOARD_SIZE && board[r][c] && board[start][c] && board[r][c].type === board[start][c].type;
        if (!same) {
          if (r - start >= 3) {
            const cells = [];
            for (let rr = start; rr < r; rr++) cells.push([rr, c]);
            runs.push({ cells, dir: "col" });
          }
          start = r;
        }
      }
    }
    return runs;
  }
